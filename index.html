<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP Web Flasher</title>
    
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --danger-bg: rgba(220, 53, 69, 0.1);
            --danger-border: #dc3545;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --card-bg: #1e1e1e;
                --text-color: #e0e0e0;
                --border-color: #333333;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .flasher-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 1.8rem;
        }

        /* Контейнер для фото */
        .device-image-container {
            margin: 20px 0;
            display: flex;
            justify-content: center;
        }

        /* Квадратне фото з закругленням кутів */
        .device-image {
            width: 100%;
            max-width: 300px;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 24px !important;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
            display: block;
        }

        .form-group {
            margin: 20px 0;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s ease;
        }

        select:focus {
            border-color: var(--primary-color);
        }

        /* Стилі для Changelog */
        .changelog-box {
            margin-top: 15px;
            padding: 14px 16px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            text-align: left;
        }

        .changelog-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .changelog-title {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-color);
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .badge.beta {
            background-color: rgba(255, 193, 7, 0.2);
            color: #d97706;
            border: 1px solid #f59e0b;
        }

        .badge.stable {
            background-color: rgba(40, 167, 69, 0.2);
            color: #28a745;
            border: 1px solid #28a745;
        }

        .changelog-list {
            margin: 0;
            padding-left: 18px;
            font-size: 0.85rem;
            color: var(--text-color);
            line-height: 1.5;
        }

        .changelog-list li {
            margin-bottom: 4px;
        }

        .changelog-list li:last-child {
            margin-bottom: 0;
        }

        .install-container {
            margin-top: 25px;
        }

        .install-button {
            background: var(--primary-color);
            color: white;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .install-button:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        esp-web-install-button {
            display: block;
            width: 100%;
        }

        .alert-box {
            border-radius: 10px;
            padding: 12px 15px;
            margin: 15px 0;
            text-align: left;
            font-size: 0.9rem;
        }

        .alert-box.danger {
            background-color: var(--danger-bg);
            border: 1px solid var(--danger-border);
        }

        .alert-box p {
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="flasher-card">
        <h1>Прошивка пристрою</h1>
        
        <!-- Фото пристрою -->
        <div class="device-image-container">
            <img src="device.png" alt="Фото пристрою" class="device-image" id="device-img">
        </div>

        <!-- Вибір версії прошивки -->
        <div class="form-group">
            <label for="release-select">Виберіть версію прошивки:</label>
            <select id="release-select">
                <option value="manifest_3.6.1-b1.json">Версія 3.6.1-b1 (Beta)</option>
                <option value="manifest_3.6.json">Версія 3.6 (Стабільна)</option>
            </select>

            <!-- Блок для відображення списку змін (Changelog) -->
            <div id="changelog-container" class="changelog-box">
                <div class="changelog-header">
                    <span class="changelog-title">Список змін</span>
                    <span id="changelog-badge" class="badge"></span>
                </div>
                <ul id="changelog-list" class="changelog-list">
                    <!-- Пункти заповнюються через JS -->
                </ul>
            </div>
        </div>

        <!-- Кнопка установки -->
        <div class="install-container">
            <esp-web-install-button id="install-btn" manifest="manifest_3.6.1-b1.json">
                <button slot="activate" class="install-button" type="button">Встановити</button>
                
                <div slot="unsupported">
                    <div class="alert-box danger">
                        <p><strong>Помилка:</strong> Ваш браузер не підтримує Web Serial API. Скористайтеся Chrome, Edge або Opera на ПК.</p>
                    </div>
                </div>
                
                <div slot="not-allowed">
                    <div class="alert-box danger">
                        <p><strong>Помилка:</strong> Прошивка доступна лише через протокол HTTPS або на localhost.</p>
                    </div>
                </div>
            </esp-web-install-button>
        </div>
    </div>

    <!-- Підключення офіційного скрипта ESP Web Tools -->
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>

    <script>
        // Структура даних із даними про зміни
        const changelogs = {
            'manifest_3.6.1-b1.json': {
                type: 'beta',
                label: 'Beta',
                changes: [
                    'Оновлено алгоритм стабілізації Wi-Fi з'єднання',
                    'Додано підтримку нових цифрових датчиків',
                    'Виправлено помилку з підключенням до прихованих мереж',
                    'Експериментальна підтримка протоколу WebSocket'
                ]
            },
            'manifest_3.6.json': {
                type: 'stable',
                label: 'Стабільна',
                changes: [
                    'Офіційний стабільний реліз',
                    'Оптимізовано використання оперативної памʼяті (RAM)',
                    'Покращено швидкість відгуку веб-інтерфейсу',
                    'Виправлено витік памʼяті при тривалій роботі'
                ]
            }
        };

        const selectEl = document.getElementById('release-select');
        const installBtn = document.getElementById('install-btn');
        const changelogList = document.getElementById('changelog-list');
        const changelogBadge = document.getElementById('changelog-badge');

        function updateChangelog() {
            const selectedValue = selectEl.value;
            const data = changelogs[selectedValue];

            if (data) {
                // Оновлюємо маркер стану (Beta / Stable)
                changelogBadge.textContent = data.label;
                changelogBadge.className = `badge ${data.type}`;

                // Наповнюємо список елементів <li>
                changelogList.innerHTML = '';
                data.changes.forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = item;
                    changelogList.appendChild(li);
                });

                // Оновлюємо атрибут manifest для Web Tools кнопки
                installBtn.setAttribute('manifest', selectedValue);
            }
        }

        selectEl.addEventListener('change', updateChangelog);

        // Початкова ініціалізація при завантаженні
        updateChangelog();
    </script>
</body>
</html>
