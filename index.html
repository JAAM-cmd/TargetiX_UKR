<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP Web Flasher</title>
    
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --border-color: #e0e0e0;
            --danger-bg: #dc354520;
            --danger-border: #dc3545;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --card-bg: #1e1e1e;
                --text-color: #e0e0e0;
                --border-color: #333333;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .flasher-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 1.8rem;
        }

        /* Контейнер для фото */
        .device-image-container {
            margin: 20px 0;
            display: flex;
            justify-content: center;
        }

        /* Квадратное фото с гарантированным закруглением углов */
        .device-image {
            width: 100%;
            max-width: 300px;             /* Размер квадратного фото */
            aspect-ratio: 1 / 1;           /* Пропорции 1 к 1 */
            object-fit: cover;             /* Картинка заполнит квадрат без искажений */
            border-radius: 24px !important;/* Закругление углов */
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
            display: block;
        }

        .form-group {
            margin: 20px 0;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 1rem;
            box-sizing: border-box;
        }

        .install-container {
            margin-top: 25px;
        }

        .install-button {
            background: var(--primary-color);
            color: white;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .install-button:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        esp-web-install-button {
            display: inline-block;
        }

        .alert-box {
            border-radius: 10px;
            padding: 12px 15px;
            margin: 15px 0;
            text-align: left;
            font-size: 0.9rem;
        }

        .alert-box.danger {
            background-color: var(--danger-bg);
            border: 1px solid var(--danger-border);
        }

        .alert-box p {
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="flasher-card">
        <h1>Прошивка пристрою</h1>
        
        <!-- Квадратное фото с закругленными углами -->
        <div class="device-image-container">
            <img src="device.png" alt="Фото пристрою" class="device-image" id="device-img">
        </div>

        <!-- Выбор версии прошивки -->
        <div class="form-group">
            <label for="release-select">Виберіть версію прошивки:</label>
            <select id="release-select">
                <option value="manifest.json">Версія 1.0.0 (Стабільна)</option>
            </select>
        </div>

        <!-- Кнопка установки -->
        <div class="install-container">
            <esp-web-install-button id="install-btn" manifest="manifest.json">
                <button slot="activate" class="install-button" type="button">Встановити</button>
                
                <div slot="unsupported">
                    <div class="alert-box danger">
                        <p><strong>Помилка:</strong> Ваш браузер не підтримує Web Serial API. Скористайтеся Chrome, Edge або Opera на ПК.</p>
                    </div>
                </div>
                
                <div slot="not-allowed">
                    <div class="alert-box danger">
                        <p><strong>Помилка:</strong> Прошивка доступна лише через протокол HTTPS або на localhost.</p>
                    </div>
                </div>
            </esp-web-install-button>
        </div>
    </div>

    <!-- Подключение официального скрипта ESP Web Tools -->
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>

    <script>
        const selectEl = document.getElementById('release-select');
        const installBtn = document.getElementById('install-btn');

        selectEl.addEventListener('change', (event) => {
            if (event.target.value) {
                installBtn.setAttribute('manifest', event.target.value);
            }
        });
    </script>
</body>
</html>
